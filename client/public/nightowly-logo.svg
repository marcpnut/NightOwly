<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 390 72" role="img" aria-label="NightOwly">
  <defs>
    <clipPath id="owl-only"><rect width="76" height="72"/></clipPath>
    <linearGradient id="word" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f5edff"/>
      <stop offset=".60" stop-color="#d9c5ff"/>
      <stop offset=".76" stop-color="#16d9ff"/>
      <stop offset="1" stop-color="#c32cff"/>
    </linearGradient>
  </defs>
  <image x="0" y="0" width="282" height="72" clip-path="url(#owl-only)" xlink:href="./nightowl-logo.png"/>
  <text x="82" y="51" fill="url(#word)" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" letter-spacing="-2">NightOwly</text>
</svg>
